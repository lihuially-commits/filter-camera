name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project FilterCamera/FilterCamera.xcodeproj \
            -target FilterCamera \
            -sdk iphoneos \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -40

      - name: Package IPA
        run: |
          plutil -p build/FilterCamera.app/Info.plist
          mkdir -p Payload
          cp -R build/FilterCamera.app Payload/
          zip -qry FilterCamera.ipa Payload
          ls -lh FilterCamera.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FilterCamera-ipa
          path: FilterCamera.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
